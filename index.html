<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Web</title>
    <style>
        /* Mengunci layar utama agar tidak bisa digeser ke samping */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: #f4f6f8;
        }
        
        /* Mengatur iframe agar pas di layar HP */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Ganti URL di bawah ini dengan URL Web App Google Apps Script Anda -->
    <iframe src="https://script.google.com/macros/s/AKfycbyyxf4fwzdcTHIeyzEAh7Llrb1N6kn8cA3BgyslY4A-DMrdjtMShwd34x5ADk_1lsDL/exec" allow="camera; microphone; geolocation"></iframe>
</body>
</html>
