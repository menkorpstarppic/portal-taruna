<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Web</title>
    <style>
        /* Mengunci total seluruh halaman agar tidak bisa digeser keluar frame */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #ffffff;
            touch-action: none; /* Mencegah gestur geser liar di level body */
        }
        
        /* Memaksa iframe terkunci tepat di dalam layar penuh */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <!-- Ganti URL di bawah ini dengan URL Web App Google Apps Script Anda -->
    <iframe src="https://script.google.com/macros/s/AKfycbyyxf4fwzdcTHIeyzEAh7Llrb1N6kn8cA3BgyslY4A-DMrdjtMShwd34x5ADk_1lsDL/exec" allow="camera; microphone; geolocation"></iframe>
</body>
</html>
